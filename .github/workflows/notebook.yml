name: Notebook

# Executes the executable specification (clinical-model-validation-toolkit.ipynb)
# end-to-end on a clean checkout and fails the build if any cell errors. This is
# the mechanical enforcement of "the notebook this package was built from still
# runs top-to-bottom," independent of the package's own pytest suite.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package (editable, with dev extras)
        run: pip install -e ".[dev]"

      - name: Execute notebook end-to-end
        run: |
          jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=900 \
            --ExecutePreprocessor.kernel_name=python3 \
            --output executed.ipynb \
            clinical-model-validation-toolkit.ipynb

      - name: Upload executed notebook
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebook
          path: executed.ipynb
        if: always()
