[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cmvt"
version = "0.1.0"
description = "A reproducible, synthetic-first validation harness for clinical prediction models: DeLong AUROC comparison, calibration, cluster bootstrap, distribution-shift metrics, decidable data-integrity checks, and a validation engine that separates true distribution shift from information loss."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ahmed Fawaz" }]
requires-python = ">=3.10"
keywords = [
    "clinical-prediction-models",
    "external-validation",
    "calibration",
    "TRIPOD-AI",
    "DeLong",
    "distribution-shift",
    "reproducibility",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "nbclient>=0.10",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
]

[project.urls]
Homepage = "https://github.com/ahmedfawaz879/clinical-model-validation-toolkit"
Repository = "https://github.com/ahmedfawaz879/clinical-model-validation-toolkit"
Issues = "https://github.com/ahmedfawaz879/clinical-model-validation-toolkit/issues"

[project.scripts]
cmvt-demo = "cmvt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cmvt"]

[tool.pytest.ini_options]
addopts = "--cov=cmvt --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/cmvt"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
# Checked against 3.12 because installed numpy's bundled stubs use 3.12-only
# stub syntax; the package itself still targets/runs on >=3.10 (see requires-python).
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
allow_redefinition = true
